<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dang nhap - CTKM PNJ Training</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root {
    --pnj-gold: #C8A850;
    --pnj-gold-light: #E8D48A;
    --pnj-gold-dark: #A08030;
    --pnj-black: #1A1A1A;
    --pnj-white: #FFFFFF;
    --pnj-bg: #F5F0E5;
    --pnj-red: #D32F2F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--pnj-bg);
    color: var(--pnj-black);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-text-size-adjust: 100%;
  }

  .login-card {
    background: var(--pnj-white);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    overflow: hidden;
    width: 100%;
    max-width: 400px;
  }

  .login-header {
    background: linear-gradient(135deg, var(--pnj-black) 0%, #3a3a3a 50%, var(--pnj-black) 100%);
    color: var(--pnj-white);
    text-align: center;
    padding: 32px 24px 24px;
    position: relative;
    overflow: hidden;
  }
  .login-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 30px, rgba(200,168,80,0.03) 30px, rgba(200,168,80,0.03) 60px);
  }
  .login-badge {
    display: inline-block;
    background: var(--pnj-gold);
    color: var(--pnj-black);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 14px;
    border-radius: 20px;
    margin-bottom: 12px;
    letter-spacing: 1px;
    position: relative;
  }
  .login-header h1 {
    font-size: 22px;
    font-weight: 900;
    position: relative;
    text-shadow: 0 2px 10px rgba(200,168,80,0.3);
  }
  .login-header h1 span { color: var(--pnj-gold); }
  .login-header .subtitle {
    font-size: 13px;
    color: var(--pnj-gold-light);
    font-weight: 500;
    margin-top: 6px;
    position: relative;
  }

  .login-body {
    padding: 28px 24px 32px;
  }

  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #555;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 500;
    transition: border-color 0.2s;
    background: #FAFAF5;
    -webkit-appearance: none;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--pnj-gold);
    background: var(--pnj-white);
  }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: var(--pnj-gold);
    color: var(--pnj-black);
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    -webkit-appearance: none;
  }
  .btn-login:hover {
    background: var(--pnj-gold-dark);
    color: var(--pnj-white);
  }
  .btn-login:active {
    transform: scale(0.98);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    color: #bbb;
    font-size: 12px;
    font-weight: 600;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e0e0e0;
  }

  .btn-guest {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: #777;
    border: 2px solid #d0d0d0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    text-decoration: none;
    display: block;
    text-align: center;
    -webkit-appearance: none;
  }
  .btn-guest:hover {
    border-color: var(--pnj-gold);
    color: var(--pnj-gold-dark);
    background: #FAFAF5;
  }
  .btn-guest-note {
    font-size: 11px;
    color: #aaa;
    text-align: center;
    margin-top: 8px;
    line-height: 1.5;
  }

  .error-msg {
    background: #FFEBEE;
    color: var(--pnj-red);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 18px;
    text-align: center;
    border: 1px solid #FFCDD2;
  }

  .login-footer {
    text-align: center;
    padding: 0 24px 24px;
    font-size: 11px;
    color: #aaa;
  }

  @media (max-width: 480px) {
    body { padding: 16px; }
    .login-card { border-radius: 16px; }
    .login-header { padding: 24px 20px 20px; }
    .login-header h1 { font-size: 20px; }
    .login-body { padding: 24px 20px 28px; }
    .form-group input { padding: 11px 12px; font-size: 16px; }
    .btn-login { padding: 13px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <div class="login-badge">NỘI BỘ</div>
    <h1><span>PNJ</span> TRAINING</h1>
    <div class="subtitle">Chương trình khuyến mãi</div>
  </div>

  <div class="login-body">
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="username">Tài khoản</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="off" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
    </form>

    <div class="divider">hoặc</div>

    <a href="{{ url_for('guest_login') }}" class="btn-guest">Xem với tư cách Khách</a>
    <div class="btn-guest-note">Chế độ khách chỉ xem được thông tin hạn chế.<br>Đăng nhập để xem đầy đủ nội dung.</div>
  </div>

  <div class="login-footer">
    Tài liệu nội bộ PNJ | Liên hệ quản lý nếu quên mật khẩu
  </div>
</div>

</body>
</html>
