<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CTKM PNJ{% endblock %}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root {
    --pnj-gold: #C8A850;
    --pnj-gold-light: #E8D48A;
    --pnj-gold-dark: #A08030;
    --pnj-black: #1A1A1A;
    --pnj-white: #FFFFFF;
    --pnj-bg: #F5F0E5;
    --pnj-red: #D32F2F;
    --pnj-green: #388E3C;
    --shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--pnj-bg);
    color: var(--pnj-black);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }

  /* TOP BAR */
  .topbar {
    background: var(--pnj-black);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .topbar-logo {
    color: var(--pnj-gold);
    font-weight: 900;
    font-size: 15px;
    white-space: nowrap;
    text-decoration: none;
  }
  .topbar-user {
    font-size: 12px;
    color: var(--pnj-gold-light);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .topbar-role {
    font-size: 10px;
    background: rgba(200,168,80,0.2);
    border: 1px solid rgba(200,168,80,0.4);
    padding: 2px 8px;
    border-radius: 10px;
    color: var(--pnj-gold-light);
    font-weight: 700;
    white-space: nowrap;
  }
  .topbar-right {
    flex-shrink: 0;
  }
  .btn-logout {
    background: transparent;
    border: 1.5px solid rgba(200,168,80,0.4);
    color: var(--pnj-gold-light);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-block;
  }
  .btn-logout:hover {
    background: var(--pnj-gold);
    color: var(--pnj-black);
    border-color: var(--pnj-gold);
  }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 24px 16px;
    font-size: 11px;
    color: #999;
    border-top: 1px solid #e0e0e0;
    margin-top: 20px;
  }

  @media (max-width: 480px) {
    .topbar { padding: 8px 12px; }
    .topbar-logo { font-size: 13px; }
    .topbar-user { font-size: 11px; }
  }
</style>
{% block extra_css %}{% endblock %}
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <a href="{{ url_for('ctkm_index') }}" class="topbar-logo">PNJ TRAINING</a>
    {% if user %}
    <span class="topbar-user">{{ user.username }}</span>
    <span class="topbar-role">{{ user.role | upper }}</span>
    {% endif %}
  </div>
  <div class="topbar-right">
    {% if user %}
    <a href="{{ url_for('logout') }}" class="btn-logout">Thoat</a>
    {% endif %}
  </div>
</div>

<!-- CONTENT -->
{% block content %}{% endblock %}

<!-- FOOTER -->
<div class="footer">
  <p><b>PNJ Training Hub</b> | Tài liệu nội bộ dành cho TVV</p>
</div>

</body>
</html>
